name: Audio de escena Chatterbox

on:
  workflow_dispatch:
  push:
    paths:
      - herramientas/escena_chatterbox.py
      - .github/workflows/escena-chatterbox.yml

permissions:
  contents: write

jobs:
  escena:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Chatterbox (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
      - name: Traer las voces de Gemini elegidas
        run: |
          git fetch -q origin voces-gemini
          mkdir -p /tmp/refs
          for f in neuron-3-iapetus.mp3 glip-1-puck.mp3 bruno-3-achird.mp3; do
            git show "origin/voces-gemini:$f" > "/tmp/refs/$f"
          done
      - name: Generar escena
        run: python -u herramientas/escena_chatterbox.py /tmp/refs /tmp/escena
      - name: Subir a la rama escena-chatterbox
        if: always()
        run: |
          mkdir -p /tmp/escena && cd /tmp/escena && touch .keep
          git init -q -b escena-chatterbox
          git config user.name "mente-curiosa-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Escena de la Luna con Chatterbox"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" escena-chatterbox
