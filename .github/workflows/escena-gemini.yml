name: Audio de escena Gemini

on:
  workflow_dispatch:
  push:
    paths:
      - herramientas/escena_gemini.py
      - .github/workflows/escena-gemini.yml

permissions:
  contents: write

jobs:
  voces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generar muestras
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u herramientas/escena_gemini.py /tmp/escena
      - name: Subir a la rama escena-gemini
        if: always()
        run: |
          mkdir -p /tmp/escena && cd /tmp/escena && touch .keep
          git init -q -b escena-gemini
          git config user.name "mente-curiosa-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Audio de escena Gemini"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" escena-gemini
