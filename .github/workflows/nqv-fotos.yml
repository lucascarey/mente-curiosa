name: Nada Que Ver - fotos candidatas

on:
  # Cuando se suben guiones con fotos sin elegir ({"buscar": "..."}), baja candidatas de Wikimedia Commons
  # y deja una hoja de contacto por guion en la rama nqv-fotos, para elegir mirándolas.
  push:
    paths:
      - nqv/guiones/pendientes/**
      - nqv/fotos.py
      - .github/workflows/nqv-fotos.yml

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow
      - run: python -u -m nqv.fotos buscar nqv/guiones/pendientes /tmp/fotos
      - name: Subir a la rama nqv-fotos
        run: |
          mkdir -p /tmp/fotos && cd /tmp/fotos && touch .keep
          git init -q -b nqv-fotos
          git config user.name "mente-curiosa-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Fotos candidatas ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" nqv-fotos
