name: Imágenes reales para videos NQV

on:
  workflow_dispatch:
  push:
    paths:
      - herramientas/bajar_imagenes.py
      - .github/workflows/nqv-imagenes.yml

permissions:
  contents: write

jobs:
  sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Bajar imágenes
        run: python -u herramientas/bajar_imagenes.py /tmp/img
      - name: Subir a la rama nqv-imagenes
        if: always()
        run: |
          mkdir -p /tmp/img && cd /tmp/img && touch .keep
          git init -q -b nqv-imagenes
          git config user.name "mente-curiosa-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Imágenes NQV"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" nqv-imagenes
