name: Nada Que Ver - publicar

on:
  schedule:
    # Horarios: 13 y 20 h de Argentina (16 y 23 UTC). GitHub atrasa (¡horas!) o saltea las corridas programadas,
    # así que se prueba cada 20 minutos desde la hora del horario y el paso "Decidir" publica solo si el video de
    # ese horario todavía no salió.
    - cron: "*/20 16-23 * * *"
    - cron: "*/20 0-3 * * *"
  # Vista previa sin publicar: cambiar nqv/vista.txt (primera línea: guion a armar, vacía = el próximo).
  # El video queda en la rama nqv-vista.
  push:
    paths:
      - nqv/vista.txt
  # Para publicar a mano si el horario de GitHub se saltea una corrida
  workflow_dispatch:
    inputs:
      forzar:
        description: "Publicar aunque haya salido otro video hace poco"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    # El horario automático corre salvo que la variable de repo NQV_ACTIVA diga false (Lucas lo prendió el 2026-10-25)
    if: github.event_name == 'push' || vars.NQV_ACTIVA != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      # Formato que publica el horario automático, según nqv/formato.txt: "animado" = Neurón solo con gráficos
      # (nqv/animados/pendientes); cualquier otra cosa = elenco con fotos (nqv/guiones/pendientes).
      # Publica si todavía no salió el video del último horario (16 o 23 UTC) y pasaron 2 h del anterior.
      # Mira origin/main recién bajado: una corrida que esperó en la cola puede tener un main viejo.
      - name: Decidir
        run: |
          if [ "${{ github.event_name }}" = push ]; then echo "PUBLICAR=1" >> "$GITHUB_ENV"; exit 0; fi
          git fetch -q origin main && git reset -q --hard origin/main
          ahora=$(date -u +%s); hoy=$(date -u +%F)
          horario=$(date -u -d "$(date -u -d "$hoy -1 day" +%F) 23:00" +%s)
          for h in 16:00 23:00; do t=$(date -u -d "$hoy $h" +%s); [ "$t" -le "$ahora" ] && horario=$t; done
          ultimo=$(git log -1 --format=%ct -- nqv/guiones/publicados nqv/animados/publicados); ultimo=${ultimo:-0}
          echo "Horario: $(date -u -d @$horario '+%F %H:%M') UTC. Último publicado: $(date -u -d @$ultimo '+%F %H:%M') UTC."
          if [ "${{ inputs.forzar }}" = "true" ]; then p=1; echo "Publicación forzada a mano."
          elif [ "$ultimo" -ge "$horario" ]; then p=0; echo "El video de este horario ya salió."
          elif [ $((ahora - ultimo)) -lt 7200 ]; then p=0; echo "Salió otro hace menos de 2 horas: espera a la próxima corrida."
          else p=1; fi
          echo "PUBLICAR=$p" >> "$GITHUB_ENV"
      - name: Formato
        if: env.PUBLICAR == '1'
        run: |
          f=elenco
          if [ "${{ github.event_name }}" != push ] && grep -qx animado nqv/formato.txt 2>/dev/null; then f=animado; fi
          echo "FORMATO=$f" >> "$GITHUB_ENV"; echo "Formato: $f"
      - uses: actions/setup-python@v5
        if: env.PUBLICAR == '1'
        with:
          python-version: "3.12"
      - name: Instalar
        if: env.PUBLICAR == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests numpy pillow faster-whisper
          if [ "$FORMATO" = animado ]; then
            pip install -q playwright && python -m playwright install --with-deps chromium
          fi
      - name: Revisar guiones
        if: github.event_name != 'push' && env.PUBLICAR == '1'
        run: |
          if [ "$FORMATO" = animado ]; then python -m nqv.animado.armar --validar; else python -m nqv.main --validar; fi
      - name: Armar y publicar
        if: env.PUBLICAR == '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACIDAD: ${{ vars.TIKTOK_PRIVACIDAD || 'SELF_ONLY' }}
          MC_TOKENS_DIR: ${{ runner.temp }}/tokens
          # Para dejar el video en la rama video-publico, de donde lo baja Instagram
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -u -m nqv.main --vista "$(head -1 nqv/vista.txt | tr -d '\r')"
          elif [ "$FORMATO" = animado ]; then
            git fetch -q origin nqv-animado && git worktree add /tmp/vista-animado origin/nqv-animado || mkdir -p /tmp/vista-animado
            python -u -m nqv.animado.armar --publicar /tmp/vista-animado
          else
            python -u -m nqv.main
          fi
      - name: Subir la vista previa a la rama nqv-vista
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p salida /tmp/vista
          find salida -name '*.mp4' -exec cp {} /tmp/vista/ \;
          find salida -name 'tiempos.json' -exec cp {} /tmp/vista/ \;
          cd /tmp/vista && touch .keep
          for f in *.mp4; do
            [ -f "$f" ] || continue
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            ffmpeg -v error -i "$f" -vf "fps=8/$dur,scale=270:-1,tile=8x1" -frames:v 1 "${f%.mp4}-cuadros.jpg"
          done
          git init -q -b nqv-vista
          git config user.name "mente-curiosa-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Vista previa ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" nqv-vista
      - name: Actualizar tokens renovados
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          dir="${{ runner.temp }}/tokens"
          [ -d "$dir" ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Hay tokens renovados pero falta el secreto GH_PAT para guardarlos"
            exit 0
          fi
          for f in "$dir"/*; do gh secret set "$(basename "$f")" --repo "$GITHUB_REPOSITORY" < "$f"; done
      - name: Marcar guion como publicado
        if: github.event_name != 'push' && env.PUBLICAR == '1'
        run: |
          git config user.name "mente-curiosa-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A nqv/guiones nqv/animados
          git diff --cached --quiet && exit 0
          git commit -qm "Publicado $(git diff --cached --name-only | grep publicados | head -1 | sed -E 's#.*publicados/([^/]+).*#\1#')"
          git push -q
