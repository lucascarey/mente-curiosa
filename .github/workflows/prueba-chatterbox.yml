name: Prueba de voces Chatterbox

on:
  workflow_dispatch:
  push:
    paths:
      - herramientas/prueba_chatterbox.py
      - .github/workflows/prueba-chatterbox.yml

permissions:
  contents: write

jobs:
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Chatterbox (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
      - name: Traer las voces de Gemini elegidas
        run: |
          git fetch -q origin voces-gemini
          mkdir -p /tmp/refs
          for f in neuron-3-iapetus.mp3 bruno-1-fenrir.mp3 bruno-2-puck.mp3 bruno-3-achird.mp3; do
            git show "origin/voces-gemini:$f" > "/tmp/refs/$f"
          done
      - name: Generar pruebas
        run: python -u herramientas/prueba_chatterbox.py /tmp/refs /tmp/chatterbox
      - name: Subir a la rama prueba-chatterbox-bruno
        if: always()
        run: |
          mkdir -p /tmp/chatterbox && cd /tmp/chatterbox && touch .keep
          git init -q -b prueba-chatterbox-bruno
          git config user.name "mente-curiosa-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Prueba de voces Chatterbox para Neurón y Bruno"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prueba-chatterbox-bruno
