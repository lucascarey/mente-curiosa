name: Publicar prototipo

on:
  # Se dispara al cambiar herramientas/publicar_prototipo.txt (el texto de la publicación):
  # publica el video que está en la rama prototipo-video.
  push:
    paths:
      - herramientas/publicar_prototipo.txt

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -q requests
      - name: Bajar el video
        run: |
          git fetch -q origin prototipo-video
          mkdir -p /tmp/pub
          git show origin/prototipo-video:prototipo-luna.mp4 > /tmp/pub/nada-que-ver-luna.mp4
          ls -la /tmp/pub
      - name: Publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACIDAD: ${{ vars.TIKTOK_PRIVACIDAD || 'SELF_ONLY' }}
          MC_TOKENS_DIR: ${{ runner.temp }}/tokens
          GH_TOKEN: ${{ github.token }}
        run: python -u herramientas/publicar_prototipo.py /tmp/pub/nada-que-ver-luna.mp4 herramientas/publicar_prototipo.txt
      - name: Actualizar tokens renovados
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          dir="${{ runner.temp }}/tokens"
          [ -d "$dir" ] || exit 0
          for f in "$dir"/*; do gh secret set "$(basename "$f")" --repo "$GITHUB_REPOSITORY" < "$f"; done
