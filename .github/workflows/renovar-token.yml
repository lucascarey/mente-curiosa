name: Renovar token de Instagram

on:
  schedule:
    - cron: "0 6 * * 1" # todos los lunes
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Renovar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MC_TOKENS_DIR: ${{ runner.temp }}/tokens
        run: python -m mc.main --renovar
      - name: Guardar el token nuevo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="${{ runner.temp }}/tokens/IG_ACCESS_TOKEN"
          [ -f "$f" ] || { echo "El token no cambió"; exit 0; }
          [ -n "$GH_TOKEN" ] || { echo "::error::Falta el secreto GH_PAT para guardar el token renovado"; exit 1; }
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
