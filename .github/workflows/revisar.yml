name: Revisar imágenes

# Arma una hoja por guion con la imagen que le toca a cada frase (rama revision)
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - herramientas/revisar_imagenes.py
      - .github/workflows/revisar.yml
      - mc/imagenes.py
      - guiones/pendientes/**

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Armar hojas
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python herramientas/revisar_imagenes.py /tmp/revision
      - name: Subir a la rama revision
        run: |
          cd /tmp/revision
          git init -q -b revision
          git config user.name "mente-curiosa-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Revisión de imágenes"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" revision
