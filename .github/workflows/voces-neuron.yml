name: Voz de Neurón (Gemini)

on:
  workflow_dispatch:
  push:
    paths:
      - herramientas/muestras_neuron.py
      - .github/workflows/voces-neuron.yml

permissions:
  contents: write

jobs:
  voces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generar muestras
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u herramientas/muestras_neuron.py /tmp/voces
      - name: Subir a la rama voces-neuron
        if: always()
        run: |
          mkdir -p /tmp/voces && cd /tmp/voces && touch .keep
          git init -q -b voces-neuron
          git config user.name "mente-curiosa-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Voz de Neurón (Gemini)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voces-neuron
