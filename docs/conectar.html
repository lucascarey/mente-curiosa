<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectar TikTok · Mente Curiosa</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff;
         font-family: Inter, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 560px; width: 100%; }
  h1 { font-weight: 600; } h1 span { color: #4FC3F7; }
  a.boton, button { display: inline-block; background: #4FC3F7; color: #000; border: 0; border-radius: 10px;
                    padding: 14px 22px; font: 600 16px Inter, system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  textarea { width: 100%; box-sizing: border-box; height: 110px; background: #111; color: #fff; border: 1px solid #4FC3F7;
             border-radius: 10px; padding: 10px; font: 13px ui-monospace, monospace; }
  p { color: #ccc; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Mente <span>Curiosa</span></h1>
  <div id="inicio">
    <p>Conectá tu cuenta de TikTok para que Mente Curiosa publique ahí sus videos de curiosidades.</p>
    <a class="boton" id="conectar" href="#">Conectar con TikTok</a>
  </div>
  <div id="listo" hidden>
    <p><b>¡Autorizado!</b> Copiá esta dirección y pegala en GitHub, en Actions, workflow "Conectar TikTok", botón Run workflow.</p>
    <textarea id="direccion" readonly></textarea>
    <p><button id="copiar">Copiar</button></p>
  </div>
  <p id="error" hidden></p>
</main>
<script>
  // El Client key no es secreto: va en el link de autorización de TikTok.
  const CLIENT_KEY = "PONER_CLIENT_KEY";
  const REDIRECCION = "https://lucascarey.github.io/mente-curiosa/conectar.html";
  const q = new URLSearchParams(location.search);
  if (q.get("code")) {
    document.getElementById("inicio").hidden = true;
    document.getElementById("listo").hidden = false;
    document.getElementById("direccion").value = location.href;
    document.getElementById("copiar").onclick = () => navigator.clipboard.writeText(location.href);
  } else if (q.get("error")) {
    const e = document.getElementById("error");
    e.hidden = false;
    e.textContent = "TikTok respondió: " + q.get("error") + " " + (q.get("error_description") || "");
  }
  const estado = Math.random().toString(36).slice(2);
  document.getElementById("conectar").href = "https://www.tiktok.com/v2/auth/authorize/?" + new URLSearchParams({
    client_key: CLIENT_KEY, response_type: "code", scope: "user.info.basic,video.publish",
    redirect_uri: REDIRECCION, state: estado,
  });
</script>
</body>
</html>
